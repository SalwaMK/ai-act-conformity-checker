[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-conformity-checker"
version = "0.1.0"
description = "EU AI Act Conformity Checker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "euaiact",
    "groq",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
